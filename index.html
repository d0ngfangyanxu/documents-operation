const p=JSON.parse(document.getElementById("payload").textContent);const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));document.getElementById("unlock").addEventListener("submit",async e=>{e.preventDefault();const btn=e.target.querySelector("button");const error=document.getElementById("error");btn.disabled=true;error.textContent="正在解锁…";try{const enc=new TextEncoder();const raw=await crypto.subtle.importKey("raw",enc.encode(document.getElementById("password").value),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(p.salt),iterations:p.rounds,hash:"SHA-256"},raw,512);const m=new Uint8Array(bits),iv=b64(p.iv),body=b64(p.ciphertext);const hk=await crypto.subtle.importKey("raw",m.slice(32,64),{name:"HMAC",hash:"SHA-256"},false,["verify"]);if(!await crypto.subtle.verify("HMAC",hk,b64(p.mac),new Uint8Array([...iv,...body])))throw Error("mac");const ak=await crypto.subtle.importKey("raw",m.slice(0,32),"AES-CBC",false,["decrypt"]);const bytes=await crypto.subtle.decrypt({name:"AES-CBC",iv},ak,body);const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(_){error.textContent="密码不正确，或内容无法解锁。";btn.disabled=false}});
